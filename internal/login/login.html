<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - {{.Realm}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 2rem; width: 100%; max-width: 400px; }
        .tengwar { display: block; margin: 0 auto 0.25rem; }
        .tagline { text-align: center; font-size: 0.75rem; color: #888; font-style: italic; margin-bottom: 1.25rem; letter-spacing: 0.03em; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; color: #333; }
        .error { background: #fee; border: 1px solid #fcc; color: #c33; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.875rem; }
        label { display: block; margin-bottom: 0.25rem; font-size: 0.875rem; color: #555; }
        input[type="text"], input[type="password"] { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; margin-bottom: 1rem; }
        input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: #4a90d9; box-shadow: 0 0 0 2px rgba(74,144,217,0.2); }
        button { width: 100%; padding: 0.75rem; background: #4a90d9; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:hover { background: #357abd; }
    </style>
</head>
<body>
    <div class="card">
        <svg class="tengwar" width="180" height="70" viewBox="0 0 180 70" role="img" aria-label="Mellon — Sindarin for Friend" xmlns="http://www.w3.org/2000/svg">
            <g fill="none" stroke="#4a90d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- e tehta (acute) above malta -->
                <path d="M 18 10 L 28 6"/>
                <!-- malta (m): stem with two lúvar on the right, below the line -->
                <line x1="25" y1="18" x2="25" y2="58"/>
                <path d="M 25 32 Q 42 32 42 46 Q 42 58 25 58"/>
                <path d="M 25 22 Q 36 22 36 32"/>
                <!-- lambe (l): stem with single lúva on the right -->
                <line x1="70" y1="18" x2="70" y2="58"/>
                <path d="M 70 36 Q 86 36 86 50 Q 86 58 70 58"/>
                <!-- doubling bar beneath lambe to indicate "ll" -->
                <line x1="63" y1="64" x2="88" y2="64"/>
                <!-- short carrier bearing the o tehta (right-curl) -->
                <line x1="115" y1="30" x2="115" y2="58"/>
                <path d="M 109 20 Q 115 12 121 20" stroke-width="1.6"/>
                <!-- númen (n): stem with two lúvar on the left, below the line -->
                <line x1="155" y1="18" x2="155" y2="58"/>
                <path d="M 155 32 Q 138 32 138 46 Q 138 58 155 58"/>
                <path d="M 155 22 Q 144 22 144 32"/>
            </g>
        </svg>
        <div class="tagline">pedo mellon a minno</div>
        <h1>Sign In</h1>
        {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
        <form method="POST" action="/realms/{{.Realm}}/login">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <input type="hidden" name="client_id" value="{{.ClientID}}">
            <input type="hidden" name="redirect_uri" value="{{.RedirectURI}}">
            <input type="hidden" name="scope" value="{{.Scope}}">
            <input type="hidden" name="state" value="{{.State}}">
            <input type="hidden" name="nonce" value="{{.Nonce}}">
            <input type="hidden" name="response_type" value="{{.ResponseType}}">
            <input type="hidden" name="code_challenge" value="{{.CodeChallenge}}">
            <input type="hidden" name="code_challenge_method" value="{{.ChallengeMethod}}">
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
